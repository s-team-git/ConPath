<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ConPath real-data and event-calibration pipeline</title>
  <desc id="desc">RGB and depth are lifted into a world-frame support map, uncertain cells are sampled into independent or correlated worlds, and footprint-conditioned connectivity produces an event probability.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fbfd"/><stop offset="1" stop-color="#eef4f7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2c4c62" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#55748f"/></marker>
  </defs>
  <rect width="1200" height="360" rx="16" fill="url(#bg)"/>
  <style>
    .box{fill:#fff;stroke:#d7e2e9;stroke-width:2}.title{font:700 20px Arial,sans-serif;fill:#243746}.sub{font:14px Arial,sans-serif;fill:#667b89}.tiny{font:12px Arial,sans-serif;fill:#718592}.arrow{stroke:#55748f;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <g filter="url(#shadow)">
    <rect class="box" x="34" y="72" width="205" height="214" rx="13"/>
    <rect class="box" x="284" y="72" width="205" height="214" rx="13"/>
    <rect class="box" x="534" y="72" width="270" height="214" rx="13"/>
    <rect class="box" x="849" y="72" width="315" height="214" rx="13"/>
  </g>
  <text class="title" x="54" y="108">RGB-D evidence</text>
  <text class="sub" x="54" y="132">TUM Freiburg1/desk</text>
  <rect x="54" y="153" width="76" height="88" rx="5" fill="#c7d9e5"/>
  <rect x="139" y="153" width="76" height="88" rx="5" fill="#d8e9d9"/>
  <path d="M60 224 82 188l14 19 16-28 14 45" fill="none" stroke="#315b86" stroke-width="4"/>
  <path d="M145 222c18-35 27-44 64-57M145 222c20-7 41-7 67 7" fill="none" stroke="#2d8a70" stroke-width="3"/>
  <text class="tiny" x="54" y="266">RGB + registered depth</text>

  <text class="title" x="304" y="108">Lift + fuse</text>
  <text class="sub" x="304" y="132">camera pose → world frame</text>
  <g transform="translate(310 156)">
    <path d="M0 72 75 12l94 40-75 61z" fill="#edf3f6" stroke="#86a2b4" stroke-width="2"/>
    <path d="M15 69 88 25l64 30-75 42z" fill="#b9d8c8"/>
    <circle cx="85" cy="55" r="8" fill="#315b86"/><path d="M85 55 132 79" stroke="#315b86" stroke-width="3"/>
    <circle cx="132" cy="79" r="6" fill="#c47b38"/>
  </g>
  <text class="tiny" x="304" y="266">intrinsics + MoCap + depth</text>

  <text class="title" x="554" y="108">Joint world samples</text>
  <text class="sub" x="554" y="132">unknown cells stay uncertain</text>
  <g transform="translate(554 158)">
    <rect width="80" height="80" rx="6" fill="#f3f7f9" stroke="#ccdbe3"/>
    <path d="M0 40h80M40 0v80" stroke="#d6e2e8"/>
    <circle cx="18" cy="18" r="5" fill="#2d8a70"/><circle cx="61" cy="24" r="5" fill="#2d8a70"/><circle cx="27" cy="64" r="5" fill="#c47b38"/><circle cx="64" cy="62" r="5" fill="#315b86"/>
    <path d="M100 40h22" class="arrow"/>
    <rect x="137" width="80" height="80" rx="6" fill="#f3f7f9" stroke="#ccdbe3"/>
    <path d="M137 40h80M177 0v80" stroke="#d6e2e8"/>
    <path d="M146 66c13-48 32-47 61-7" fill="none" stroke="#2d8a70" stroke-width="5"/>
    <circle cx="146" cy="66" r="5" fill="#2d8a70"/><circle cx="207" cy="59" r="5" fill="#315b86"/>
  </g>
  <text class="tiny" x="554" y="266">independent vs correlated completion</text>

  <text class="title" x="869" y="108">Event probability</text>
  <text class="sub" x="869" y="132">footprint-aware connectivity</text>
  <path d="M884 225c32-62 61-62 91-2 31 59 58 46 94-22" fill="none" stroke="#2d8a70" stroke-width="6" stroke-linecap="round"/>
  <circle cx="884" cy="225" r="9" fill="#315b86"/><circle cx="1069" cy="201" r="9" fill="#c47b38"/>
  <text class="title" x="894" y="251" font-size="24">q(s, g, r | X)</text>
  <text class="tiny" x="869" y="275">Brier · NLL · ECE · false-safe rate</text>

  <path d="M239 179h38" class="arrow"/><path d="M489 179h38" class="arrow"/><path d="M804 179h31" class="arrow"/>
  <text class="tiny" x="600" y="39" text-anchor="middle">real geometry in · calibrated planning event out</text>
</svg>

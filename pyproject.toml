[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conpath"
version = "0.2.0"
description = "Connectivity-calibrated path reliability research prototype"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.24",
  "torch>=2.2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
